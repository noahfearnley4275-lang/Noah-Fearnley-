<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOAH FEARNLEY GIVEAWAY</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #11152f, #292d70);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin: 25px 15px 8px;
  font-size: 32px;
}

p {
  font-size: 20px;
  margin: 5px 15px 20px;
}

#wheelBox {
  position: relative;
  width: min(92vw, 520px);
  height: min(92vw, 520px);
  margin: 10px auto 25px;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

#pointer {
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 32px solid transparent;
  border-right: 32px solid transparent;
  border-top: 65px solid white;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.5));
  z-index: 5;
}

#spinButton {
  display: block;
  margin: 20px auto;
  width: min(80vw, 500px);
  padding: 22px;
  border: none;
  border-radius: 60px;
  background: #ffd21a;
  color: #000;
  font-size: 38px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,.3);
}

#spinButton:active {
  transform: scale(.97);
}

#spinButton:disabled {
  opacity: .6;
}

#result {
  margin: 20px auto 40px;
  width: 90%;
  max-width: 550px;
  font-size: 25px;
  font-weight: bold;
  min-height: 70px;
}

@media (max-width: 450px) {
  h1 {
    font-size: 27px;
  }

  p {
    font-size: 18px;
  }

  #spinButton {
    font-size: 32px;
    padding: 18px;
  }
}
</style>
</head>

<body>

<h1>🎉 NOAH FEARNLEY GIVEAWAY 🎉</h1>
<p>Spin the wheel and see what you win!</p>

<div id="wheelBox">
  <div id="pointer"></div>
  <canvas id="wheel"></canvas>
</div>

<button id="spinButton">SPIN</button>

<div id="result"></div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const button = document.getElementById("spinButton");
const result = document.getElementById("result");

const prizes = [
  "₦10,000 CASH",
  "PHONE",
  "VILLA AWARD",
  "CAR",
  "₦50,000 CASH",
  "GIFT",
  "₦100,000 CASH",
  "TRY AGAIN"
];

const colors = [
  "#e83e8c",
  "#9b4de8",
  "#ff9f0a",
  "#3d82e8",
  "#20bf55",
  "#ef4444",
  "#ff7518",
  "#18b6aa"
];

let rotation = 0;
let spinning = false;

function resizeCanvas() {
  const size = Math.min(window.innerWidth * 0.92, 520);
  const dpr = window.devicePixelRatio || 1;

  canvas.width = size * dpr;
  canvas.height = size * dpr;

  canvas.style.width = size + "px";
  canvas.style.height = size + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawWheel(size);
}

function drawWheel(size) {
  const center = size / 2;
  const radius = size / 2 - 8;
  const slice = (Math.PI * 2) / prizes.length;

  ctx.clearRect(0, 0, size, size);

  ctx.save();
  ctx.translate(center, center);
  ctx.rotate(rotation);

  for (let i = 0; i < prizes.length; i++) {
    const start = i * slice;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, start, end);
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();
    ctx.rotate(start + slice / 2);

    ctx.fillStyle = "white";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(prizes[i], radius * 0.62, 0);

    ctx.restore();
  }

  ctx.restore();

  // Center circle
  ctx.beginPath();
  ctx.arc(center, center, 65, 0, Math.PI * 2);
  ctx.fillStyle = "#11152f";
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.font = "bold 20px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("SPIN", center, center);
}

function spin() {
  if (spinning) return;

  spinning = true;
  button.disabled = true;
  result.textContent = "";

  const size = Math.min(window.innerWidth * 0.92, 520);

  const startRotation = rotation;
  const extraTurns = 5 + Math.random() * 3;

  const randomPrize = Math.floor(Math.random() * prizes.length);

  // Make the chosen prize finish underneath the pointer at the top.
  const slice = (Math.PI * 2) / prizes.length;
  const targetAngle =
    -Math.PI / 2 -
    (randomPrize * slice + slice / 2);

  const finalRotation =
    startRotation +
    extraTurns * Math.PI * 2 +
    (targetAngle - startRotation) % (Math.PI * 2);

  const duration = 5000;
  const startTime = performance.now();

  function animate(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);

    // Smooth slowing down
    const eased = 1 - Math.pow(1 - progress, 4);

    rotation =
      startRotation +
      (finalRotation - startRotation) * eased;

    drawWheel(size);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      rotation = finalRotation;
      drawWheel(size);

      result.innerHTML =
        "🎉 Congratulations! 🎉<br><br>" +
        "You won: <strong>" +
        prizes[randomPrize] +
        "</strong>";

      spinning = false;
      button.disabled = false;
    }
  }

  requestAnimationFrame(animate);
}

button.addEventListener("click", spin);

window.addEventListener("resize", resizeCanvas);

resizeCanvas();
</script>

</body>
</html>
