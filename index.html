<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jbillions Spin & Win</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111827, #312e81);
  color: white;
  text-align: center;
  min-height: 100vh;
  padding: 25px 12px;
}

h1 {
  margin-bottom: 5px;
  font-size: 30px;
}

p {
  color: #ddd;
}

.wheel-box {
  position: relative;
  width: min(90vw, 420px);
  height: min(90vw, 420px);
  margin: 30px auto;
}

canvas {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  box-shadow: 0 0 25px rgba(0,0,0,.5);
}

.pointer {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 45px solid #fff;
  z-index: 5;
  filter: drop-shadow(0 3px 3px #000);
}

button {
  border: none;
  padding: 16px 45px;
  border-radius: 50px;
  font-size: 20px;
  font-weight: bold;
  background: #facc15;
  color: #111;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,.35);
}

button:disabled {
  opacity: .6;
}

#result {
  margin: 20px auto;
  font-size: 23px;
  font-weight: bold;
  min-height: 35px;
}

.small {
  font-size: 13px;
  color: #bbb;
}
</style>
</head>

<body>

<h1>🎡 JBILLIONS SPIN & WIN</h1>
<p>Spin the wheel and see what you get!</p>

<div class="wheel-box">
  <div class="pointer"></div>
  <canvas id="wheel" width="600" height="600"></canvas>
</div>

<button id="spin">SPIN</button>

<div id="result"></div>

<p class="small">Entertainment wheel • Results are randomly selected</p>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinButton = document.getElementById("spin");
const result = document.getElementById("result");

const prizes = [
  "📱 PHONE",
  "💰 ₦50,000",
  "🚗 CAR",
  "🎁 GIFT",
  "💵 ₦10,000",
  "❌ TRY AGAIN",
  "🎧 HEADPHONES",
  "💰 ₦5,000"
];

const colors = [
  "#ef4444",
  "#22c55e",
  "#3b82f6",
  "#f59e0b",
  "#a855f7",
  "#ec4899",
  "#14b8a6",
  "#f97316"
];

let rotation = 0;
let spinning = false;

function drawWheel() {
  const center = canvas.width / 2;
  const radius = canvas.width / 2;
  const slice = (Math.PI * 2) / prizes.length;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < prizes.length; i++) {
    const start = rotation + i * slice;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, start, end);
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(start + slice / 2);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(prizes[i], radius - 25, 0);

    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(center, center, 55, 0, Math.PI * 2);
  ctx.fillStyle = "#111827";
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 18px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("SPIN", center, center);
}

function spinWheel() {
  if (spinning) return;

  spinning = true;
  spinButton.disabled = true;
  result.textContent = "Spinning... 🎡";

  const startRotation = rotation;

  // Random number of full rotations
  const extraRotations = 5 + Math.random() * 4;

  // Random winning section
  const winner = Math.floor(Math.random() * prizes.length);

  const slice = (Math.PI * 2) / prizes.length;

  // Put the selected prize at the top pointer
  const target =
    (Math.PI * 1.5) -
    (winner * slice + slice / 2);

  const finalRotation =
    startRotation +
    extraRotations * Math.PI * 2 +
    target -
    (startRotation % (Math.PI * 2));

  const duration = 5000;
  const startTime = performance.now();

  function animate(time) {
    const elapsed = time - startTime;
    const progress = Math.min(elapsed / duration, 1);

    // Smooth slowing effect
    const eased = 1 - Math.pow(1 - progress, 4);

    rotation =
      startRotation +
      (finalRotation - startRotation) * eased;

    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      rotation = finalRotation;
      drawWheel();

      result.innerHTML =
        "🎉 YOU WON: <strong>" +
        prizes[winner] +
        "</strong> 🎉";

      spinning = false;
      spinButton.disabled = false;
    }
  }

  requestAnimationFrame(animate);
}

spinButton.addEventListener("click", spinWheel);

drawWheel();
</script>

</body>
</html>
