<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOAH FEARNLEY GIVEAWAY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #11152f, #292d73);
      color: white;
      text-align: center;
      padding: 25px 10px 50px;
    }

    h1 {
      font-size: 40px;
      margin: 20px 0 15px;
      font-weight: 900;
    }

    .subtitle {
      font-size: 21px;
      margin-bottom: 25px;
    }

    .wheel-container {
      position: relative;
      width: min(92vw, 520px);
      margin: auto;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 50%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    .pointer {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 28px solid transparent;
      border-right: 28px solid transparent;
      border-top: 55px solid white;
      z-index: 5;
      filter: drop-shadow(0 3px 3px #000);
    }

    button {
      margin-top: 35px;
      padding: 18px 70px;
      border: none;
      border-radius: 50px;
      background: #ffd21a;
      color: #111;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    button:disabled {
      opacity: 0.6;
    }

    #result {
      margin-top: 25px;
      font-size: 28px;
      font-weight: bold;
      min-height: 40px;
    }
  </style>
</head>

<body>

  <h1>🎡 NOAH FEARNLEY GIVEAWAY</h1>

  <div class="subtitle">
    Spin the wheel and see what you win!
  </div>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="600" height="600"></canvas>
  </div>

  <button id="spinButton">SPIN</button>

  <div id="result"></div>

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const button = document.getElementById("spinButton");
    const result = document.getElementById("result");

    const prizes = [
      "$50,000",
      "$40,000",
      "$30,000",
      "$20,000",
      "$10,000",
      "PHONE",
      "VILLA AWARD",
      "CAR"
    ];

    const colors = [
      "#e83e8c",
      "#9b4de8",
      "#ff9f0a",
      "#3d82e8",
      "#20bf55",
      "#ef4444",
      "#ff7518",
      "#18b6aa"
    ];

    let rotation = 0;
    let spinning = false;

    function drawWheel() {
      const center = canvas.width / 2;
      const radius = center - 5;
      const slice = (Math.PI * 2) / prizes.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < prizes.length; i++) {
        const start = rotation + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();

        ctx.fillStyle = colors[i];
        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.save();

        ctx.translate(center, center);
        ctx.rotate(start + slice / 2);

        ctx.fillStyle = "white";
        ctx.font = "bold 25px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(prizes[i], radius * 0.65, 0);

        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(center, center, 65, 0, Math.PI * 2);
      ctx.fillStyle = "#11152f";
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.font = "bold 20px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("SPIN", center, center);
    }

    function spin() {
      if (spinning) return;

      spinning = true;
      button.disabled = true;
      result.textContent = "";

      const startRotation = rotation;

      const extraTurns = 5 + Math.random() * 3;
      const finalRotation =
        startRotation + extraTurns * Math.PI * 2;

      const duration = 5000;
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const eased = 1 - Math.pow(1 - progress, 4);

        rotation =
          startRotation +
          (finalRotation - startRotation) * eased;

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          rotation = finalRotation;
          drawWheel();

          showWinner();

          spinning = false;
          button.disabled = false;
        }
      }

      requestAnimationFrame(animate);
    }

    function showWinner() {
      const slice = (Math.PI * 2) / prizes.length;

      let angle =
        (-Math.PI / 2 - rotation) % (Math.PI * 2);

      if (angle < 0) {
        angle += Math.PI * 2;
      }

      const index = Math.floor(angle / slice);
result.innerHTML =
  "🎉 Congratulations! You won: <strong>" +
  prizes[index] +
  "</strong>!<br><br>" +
  '<a href="https://t.me/Privatefanchat65" target="_blank" ' +
  'style="display:inline-block;padding:14px 25px;background:#229ED9;color:white;' +
  'text-decoration:none;border-radius:30px;font-weight:bold;">' +
  '📲 CONTACT ME ON TELEGRAM</a>';
      

    button.addEventListener("click", spin);

    drawWheel();
  </script>

</body>
</html>
