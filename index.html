<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOAH FEARNLEY GIVEAWAY</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111633, #252b70);
  color: white;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px 10px 50px;
}

h1 {
  font-size: clamp(30px, 8vw, 55px);
  margin: 10px 0;
  font-weight: 900;
}

.subtitle {
  font-size: 21px;
  margin-bottom: 20px;
}

.wheel-area {
  position: relative;
  width: min(94vw, 600px);
  height: min(94vw, 600px);
  margin: auto;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.pointer {
  position: absolute;
  top: -3px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 32px solid transparent;
  border-right: 32px solid transparent;
  border-top: 65px solid white;
  filter: drop-shadow(0 4px 4px black);
  z-index: 5;
}

#spinButton {
  margin-top: 25px;
  width: min(85vw, 500px);
  padding: 20px;
  border: none;
  border-radius: 50px;
  background: #ffd21c;
  color: #000;
  font-size: 36px;
  font-weight: 900;
  cursor: pointer;
}

#spinButton:disabled {
  opacity: 0.6;
}

#result {
  margin: 25px auto;
  min-height: 70px;
  font-size: 30px;
  font-weight: 900;
}
</style>
</head>

<body>

<div class="container">

<h1>🎉 NOAH FEARNLEY GIVEAWAY 🎉</h1>

<div class="subtitle">
Spin the wheel and see what you win!
</div>

<div class="wheel-area">
  <div class="pointer"></div>
  <canvas id="wheel"></canvas>
</div>

<button id="spinButton">SPIN</button>

<div id="result"></div>

</div>

<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const button = document.getElementById("spinButton");
const result = document.getElementById("result");

const prizes = [
  "$20,000",
  "$10,000",
  "$5,000",
  "$2,000",
  "$1,000",
  "$500",
  "VILLA",
  "CAR"
];

const colors = [
  "#e91e63",
  "#673ab7",
  "#ff9800",
  "#2196f3",
  "#00a86b",
  "#f44336",
  "#ff5722",
  "#009688"
];

let rotation = 0;
let spinning = false;

function setupCanvas() {

  const size = Math.min(window.innerWidth * 0.94, 600);
  const dpr = window.devicePixelRatio || 1;

  canvas.width = size * dpr;
  canvas.height = size * dpr;

  canvas.style.width = size + "px";
  canvas.style.height = size + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawWheel(size);
}

function drawWheel(size) {

  const center = size / 2;
  const radius = size / 2 - 8;
  const slice = (Math.PI * 2) / prizes.length;

  ctx.clearRect(0, 0, size, size);

  ctx.save();

  ctx.translate(center, center);
  ctx.rotate(rotation);

  for (let i = 0; i < prizes.length; i++) {

    const start = i * slice - Math.PI / 2;
    const end = start + slice;

    /* Draw section */

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, start, end);
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 5;
    ctx.stroke();

    /* Draw prize */

    ctx.save();

    ctx.rotate(start + slice / 2);

    ctx.translate(radius * 0.62, 0);

    /*
      Keep the text horizontal and readable.
    */

    ctx.rotate(-(start + slice / 2));

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let fontSize = 24;

    if (prizes[i].length >= 8) {
      fontSize = 20;
    }

    ctx.font = "900 " + fontSize + "px Arial";

    ctx.lineWidth = 5;
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.fillStyle = "white";

    ctx.strokeText(prizes[i], 0, 0);
    ctx.fillText(prizes[i], 0, 0);

    ctx.restore();
  }

  ctx.restore();

  /* Center */

  ctx.beginPath();
  ctx.arc(center, center, radius * 0.22, 0, Math.PI * 2);

  ctx.fillStyle = "#111633";
  ctx.fill();

  ctx.strokeStyle = "white";
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.fillStyle = "white";
  ctx.font = "900 25px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText("SPIN", center, center);

  /* Outer border */

  ctx.beginPath();
  ctx.arc(center, center, radius, 0, Math.PI * 2);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 8;
  ctx.stroke();
}

function spin() {

  if (spinning) return;

  spinning = true;
  button.disabled = true;
  result.innerHTML = "";

  const size = Math.min(window.innerWidth * 0.94, 600);

  const startRotation = rotation;

  const turns = 6 + Math.random() * 2;

  const randomFinish = Math.random() * Math.PI * 2;

  const finalRotation =
    startRotation +
    turns * Math.PI * 2 +
    randomFinish;

  const duration = 5000;
  const startTime = performance.now();

  function animate(time) {

    const elapsed = time - startTime;

    let progress = elapsed / duration;

    if (progress > 1) {
      progress = 1;
    }

    const smooth =
      1 - Math.pow(1 - progress, 4);

    rotation =
      startRotation +
      (finalRotation - startRotation) * smooth;

    drawWheel(size);

    if (progress < 1) {

      requestAnimationFrame(animate);

    } else {

      spinning = false;
      button.disabled = false;

      showWinner();
    }
  }

  requestAnimationFrame(animate);
}

function showWinner() {

  const slice = (Math.PI * 2) / prizes.length;

  let angle =
    ((-rotation + Math.PI / 2) %
      (Math.PI * 2) +
      Math.PI * 2) %
    (Math.PI * 2);

  let index = Math.floor(angle / slice);

  if (index >= prizes.length) {
    index = 0;
  }

  result.innerHTML =
    "🎉 CONGRATULATIONS! 🎉<br>" +
    "You won <strong>" +
    prizes[index] +
    "</strong>!";
}

button.addEventListener("click", spin);

window.addEventListener("resize", setupCanvas);

setupCanvas();

</script>

</body>
</html>
